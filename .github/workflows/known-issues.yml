name: Known-issue ingest

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Ingest catalog (lore + Bugzilla)
        env:
          DB: ${{ runner.temp }}/known-issues.db
        run: |
          dmesg-agent learn --auto --db "$DB" \
            --auto-max-mb 512 --limit 800 \
            || echo "warn: auto ingest had failures"
      - name: Summarize
        env:
          DB: ${{ runner.temp }}/known-issues.db
        run: |
          python - "$DB" <<'PY'
          import os
          import sys
          from dmesg_agent.knownissues import KnownIssueStore
          store = KnownIssueStore(sys.argv[1])
          stats = store.stats()
          lines = ["## Known-issue ingest", f"Total: **{stats['total']}** issues"]
          lines += [f"- {r['subsystem']}: {r['n']}" for r in stats["subsystems"]]
          summary = "\n".join(lines)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(summary + "\n")
          store.close()
          if stats["total"] == 0:
              sys.exit("empty known-issue store")
          PY
      - name: Checkpoint WAL
        env:
          DB: ${{ runner.temp }}/known-issues.db
        run: |
          python - "$DB" <<'PY'
          import sqlite3
          import sys
          conn = sqlite3.connect(sys.argv[1])
          conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          conn.close()
          PY
      - name: Upload store
        uses: actions/upload-artifact@v4
        with:
          name: known-issues-db
          path: ${{ runner.temp }}/known-issues.db
          if-no-files-found: error
          retention-days: 30
