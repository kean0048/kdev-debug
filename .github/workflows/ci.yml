name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests/ -q
      - name: Eval harness self-test (offline)
        run: dmesg-agent eval
      - name: CLI smoke
        run: |
          dmesg-agent --version
          dmesg-agent --help > /dev/null
          dmesg-agent config show
          printf '[1.0] clean boot\n' > /tmp/t.txt
          # no endpoint available here: expect a clean exit 3, not a traceback
          set +e
          out=$(dmesg-agent --file /tmp/t.txt --no-triage --base-url http://127.0.0.1:1 2>&1)
          rc=$?
          set -e
          test "$rc" = 3
          echo "$out" | grep -q "cannot reach the LLM service"
      - name: sdist/wheel build
        run: |
          pip install build
          python -m build
