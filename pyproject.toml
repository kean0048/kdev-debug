[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dmesg-agent"
dynamic = ["version"]
description = "sashiko-style dmesg AI diagnosis agent: pinpoints kernel/system issues with a verifiable chain of evidence"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/kean0048/kdev-debug"

[project.optional-dependencies]
ssh = ["paramiko>=3.0"]
dev = ["pytest", "paramiko>=3.0"]

[project.scripts]
dmesg-agent = "dmesg_agent.cli:main"

[tool.setuptools.packages.find]
include = ["dmesg_agent*"]

[tool.setuptools.dynamic]
version = {attr = "dmesg_agent.__version__"}
