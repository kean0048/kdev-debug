[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmesg-agent"
version = "0.1.0"
description = "类 sashiko 的 dmesg AI 诊断 agent:定位内核/系统问题并给出可验证的证据链"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/kean0048/kdev-debug"

[project.optional-dependencies]
ssh = ["paramiko>=3.0"]
dev = ["pytest", "paramiko>=3.0"]

[project.scripts]
dmesg-agent = "dmesg_agent.cli:main"

[tool.setuptools.packages.find]
include = ["dmesg_agent*"]
